apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: harbour
  namespace: harbour
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: harbour
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300: shorter for a live demo
