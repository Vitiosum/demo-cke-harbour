apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbour
  namespace: harbour
  labels:
    app.kubernetes.io/name: harbour
spec:
  # No "replicas": the HorizontalPodAutoscaler (40-hpa.yaml) owns the count.
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # one new crane at a time
      maxUnavailable: 0  # never fewer ready cranes than asked
  selector:
    matchLabels:
      app.kubernetes.io/name: harbour
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbour
    spec:
      serviceAccountName: harbour
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harbour
          # Built and pushed by ko from the Go source, then replaced by its digest.
          image: ko://github.com/vitiosum/demo-cke-harbour
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          # POSTGRESQL_ADDON_URI and the other variables of the add-on,
          # the same names a Clever Cloud application gets (see bin/db-secret.sh).
          envFrom:
            - secretRef:
                name: harbour-db
          resources:
            requests:
              cpu: 100m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 96Mi
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Leave the Service endpoints before the app gets SIGTERM:
            # no request is sent to a crane that is about to stop.
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
